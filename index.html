<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>JALA Tolk IA - English Coach</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#111827}
    .app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
    header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:3}
    header h1{margin:0;font-size:22px}.sub{opacity:.75;font-size:13px;margin-top:3px}
    .bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.bar select,.bar button{border:0;border-radius:10px;padding:9px;background:#273449;color:white}
    main{padding:14px 14px 100px;flex:1}.card{background:white;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000d;margin-bottom:12px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f1f5f9;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}
    #chat{display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap}.ai{background:#eef2ff;align-self:flex-start}.user{background:#111827;color:white;align-self:flex-end}
    .feedback{font-size:13px;margin-top:7px;padding:10px;background:#f8fafc;border-left:3px solid #64748b;border-radius:8px}
    .composer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;padding:10px;z-index:4}.composer-inner{max-width:760px;margin:auto;display:flex;gap:8px}
    textarea{flex:1;resize:none;border:1px solid #cbd5e1;border-radius:13px;padding:12px;font:inherit;min-height:48px;max-height:120px}
    button{cursor:pointer}.send{background:#111827;color:white;border:0;border-radius:13px;padding:0 16px;font-weight:700}.mic{background:#e2e8f0;border:0;border-radius:13px;width:52px;font-size:20px}
    .mic.active{background:#fecaca}.small{font-size:12px;color:#64748b}.welcome{font-size:14px}.danger{color:#b91c1c}.ok{color:#166534}
  </style>
</head>
<body>
<div class="app">
<header>
  <h1>JALA Tolk IA 🎙️</h1>
  <div class="sub">Your personal English speaking coach</div>
  <div class="bar">
    <select id="level"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>C2</option></select>
    <select id="mode">
      <option value="conversation">Conversation</option>
      <option value="correction">Correction</option>
      <option value="speaking">Speaking Challenge</option>
      <option value="interview">Work English</option>
      <option value="travel">Travel English</option>
      <option value="pronunciation">Pronunciation</option>
    </select>
    <button id="speakToggle">🔊 Voice: ON</button>
  </div>
</header>

<main>
  <div class="card welcome">
    <b>Today's mission</b>
    <div id="mission">Speak in English for at least 10 minutes.</div>
    <div class="small" style="margin-top:6px">JALA Tolk should make you speak, not just read.</div>
  </div>

  <div class="card stats">
    <div class="stat"><b id="minutes">0</b><span>minutes</span></div>
    <div class="stat"><b id="turns">0</b><span>turns</span></div>
    <div class="stat"><b id="streak">0</b><span>day streak</span></div>
  </div>

  <div id="chat"></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <button class="mic" id="mic" title="Speak">🎙️</button>
    <textarea id="input" placeholder="Type or tap the microphone and speak in English..."></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="small" id="status" style="max-width:760px;margin:5px auto 0">Ready.</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const state=JSON.parse(localStorage.getItem("jalaTolkState")||'{"turns":0,"minutes":0,"streak":0,"lastDay":"","level":"B1","mode":"conversation","history":[],"errors":[]}');
let voiceOn=true, recognition=null, listening=false;

function save(){localStorage.setItem("jalaTolkState",JSON.stringify(state)); renderStats();}
function renderStats(){ $("minutes").textContent=state.minutes; $("turns").textContent=state.turns; $("streak").textContent=state.streak; $("level").value=state.level; $("mode").value=state.mode; }

function addMsg(text,who="ai",feedback=""){
  const box=document.createElement("div"); box.className="msg "+who; box.textContent=text;
  if(feedback){const f=document.createElement("div");f.className="feedback";f.innerHTML=feedback;box.appendChild(f)}
  $("chat").appendChild(box); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function speak(text){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=.95; u.pitch=1.05;
  const voices=speechSynthesis.getVoices();
  const female=voices.find(v=>/en-US|en-GB|en-AU/i.test(v.lang) && /female|Samantha|Google US English|Microsoft Zira|Karen|Victoria/i.test(v.name));
  if(female) u.voice=female;
  speechSynthesis.speak(u);
}
function firstMessage(){
  if(!$("chat").children.length){
    const text="Hi! I'm JALA Tolk. I'm here to help you speak English. Let's start easy: tell me about your day in 3 sentences.";
    addMsg(text); speak(text);
  }
}
function updateDay(){
  const today=new Date().toISOString().slice(0,10);
  if(state.lastDay!==today){state.streak=state.lastDay ? state.streak+1 : 1;state.lastDay=today;save();}
}
async function send(){
  const text=$("input").value.trim(); if(!text)return;
  addMsg(text,"user"); $("input").value=""; $("status").textContent="JALA Tolk is thinking...";
  state.turns++; state.minutes=Math.max(state.minutes,Math.ceil(state.turns*1.2)); updateDay(); save();
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,level:state.level,mode:state.mode,history:state.history.slice(-8),errors:state.errors.slice(-12)})});
    const data=await r.json(); if(!r.ok) throw new Error(data.error||"Request failed");
    const reply=data.reply||"Let's continue.";
    addMsg(reply,"ai",data.feedback||"");
    state.history.push(
  {role:"user",content:text},
  {role:"assistant",content:reply}
);
    if(data.error_to_remember) state.errors.push(data.error_to_remember);
    save(); speak(reply); $("status").textContent="Ready.";
}catch(e){
  console.error("JALA Tolk error:",e);
  addMsg(
    "I couldn't connect to the AI yet.",
    "ai",
    "<span class='danger'>Error:</span> "+(e.message||"Unknown error")
  );
  $("status").textContent="Connection error.";
}
document.getElementById("send").addEventListener("click", send);;
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("level").onchange=e=>{state.level=e.target.value;save()};
$("mode").onchange=e=>{state.mode=e.target.value;save()};
$("speakToggle").onclick=()=>{voiceOn=!voiceOn;$("speakToggle").textContent=voiceOn?"🔊 Voice: ON":"🔇 Voice: OFF";};

if("webkitSpeechRecognition" in window || "SpeechRecognition" in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR();
  recognition.lang="en-US"; recognition.interimResults=true; recognition.continuous=false;
  recognition.onstart=()=>{listening=true;$("mic").classList.add("active");$("status").textContent="Listening... speak in English."};
  recognition.onend=()=>{listening=false;$("mic").classList.remove("active");$("status").textContent="Ready."};
  recognition.onerror=()=>{$("status").textContent="Microphone recognition error. You can type instead."};
  recognition.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$("input").value=t;};
  $("mic").onclick=()=>listening?recognition.stop():recognition.start();
}else{$("mic").disabled=true;$("status").textContent="Voice input is not supported by this browser. Type instead.";}

speechSynthesis?.addEventListener?.("voiceschanged",()=>{});
renderStats(); firstMessage();
</script>
</body>
</html>
