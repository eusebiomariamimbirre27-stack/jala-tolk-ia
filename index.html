<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>JALA Tolk IA - English Coach</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#111827}
    .app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
    header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:3}
    header h1{margin:0;font-size:22px}.sub{opacity:.75;font-size:13px;margin-top:3px}
    .bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.bar select,.bar button{border:0;border-radius:10px;padding:9px;background:#273449;color:white}
    main{padding:14px 14px 100px;flex:1}.card{background:white;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000d;margin-bottom:12px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f1f5f9;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}
    #chat{display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap}.ai{background:#eef2ff;align-self:flex-start}.user{background:#111827;color:white;align-self:flex-end}
    .feedback{font-size:13px;margin-top:7px;padding:10px;background:#f8fafc;border-left:3px solid #64748b;border-radius:8px}
    .composer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;padding:10px;z-index:4}.composer-inner{max-width:760px;margin:auto;display:flex;gap:8px}
    textarea{flex:1;resize:none;border:1px solid #cbd5e1;border-radius:13px;padding:12px;font:inherit;min-height:48px;max-height:120px}
    button{cursor:pointer}.send{background:#111827;color:white;border:0;border-radius:13px;padding:0 16px;font-weight:700}.mic{background:#e2e8f0;border:0;border-radius:13px;width:52px;font-size:20px}
    .mic.active{background:#fecaca}.small{font-size:12px;color:#64748b}.welcome{font-size:14px}.danger{color:#b91c1c}.ok{color:#166534}
  </style>
</head>
<body>
<div class="app">
<header>
  <h1>JALA Tolk IA 🎙️</h1>
  <div class="sub">Your personal English speaking coach</div>
  <div class="bar">
    <select id="level"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>C2</option></select>
    <select id="mode">
      <option value="conversation">Conversation</option>
      <option value="correction">Correction</option>
      <option value="speaking">Speaking Challenge</option>
      <option value="interview">Work English</option>
      <option value="travel">Travel English</option>
      <option value="pronunciation">Pronunciation</option>
    </select>
    <button id="speakToggle">🔊 Voice: ON</button>
  </div>
</header>

<main>
  <div class="card welcome">
    <b>Today's mission</b>
    <div id="mission">Speak in English for at least 10 minutes.</div>
    <div class="small" style="margin-top:6px">JALA Tolk should make you speak, not just read.</div>
  </div>

  <div class="card stats">
    <div class="stat"><b id="minutes">0</b><span>minutes</span></div>
    <div class="stat"><b id="turns">0</b><span>turns</span></div>
    <div class="stat"><b id="streak">0</b><span>day streak</span></div>
  </div>

  <div id="chat"></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <button class="mic" id="mic" title="Speak">🎙️</button>
    <textarea id="input" placeholder="Type or tap the microphone and speak in English..."></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="small" id="status" style="max-width:760px;margin:5px auto 0">Ready.</div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

let state;

try {
  state = JSON.parse(
    localStorage.getItem("jalaTolkState") ||
    '{"turns":0,"minutes":0,"streak":0,"lastDay":"","level":"B1","mode":"conversation","history":[],"errors":[]}'
  );
} catch (e) {
  state = {
    turns: 0,
    minutes: 0,
    streak: 0,
    lastDay: "",
    level: "B1",
    mode: "conversation",
    history: [],
    errors: []
  };
}

state.history = Array.isArray(state.history) ? state.history : [];
state.errors = Array.isArray(state.errors) ? state.errors : [];

let voiceOn = true;
let recognition = null;
let listening = false;

function save() {
  localStorage.setItem("jalaTolkState", JSON.stringify(state));
  renderStats();
}

function renderStats() {
  $("minutes").textContent = state.minutes;
  $("turns").textContent = state.turns;
  $("streak").textContent = state.streak;
  $("level").value = state.level;
  $("mode").value = state.mode;
}

function addMsg(text, who, feedback) {
  const box = document.createElement("div");
  box.className = "msg " + (who || "ai");
  box.textContent = text;

  if (feedback) {
    const f = document.createElement("div");
    f.className = "feedback";
    f.innerHTML = feedback;
    box.appendChild(f);
  }

  $("chat").appendChild(box);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

function speak(text) {
  if (!voiceOn) return;
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.95;
  u.pitch = 1.05;

  window.speechSynthesis.speak(u);
}

function firstMessage() {
  if ($("chat").children.length === 0) {
    const text =
      "Hi! I'm JALA Tolk. I'm here to help you speak English. Let's start easy: tell me about your day in 3 sentences.";

    addMsg(text, "ai");
    speak(text);
  }
}

function updateDay() {
  const today = new Date().toISOString().slice(0, 10);

  if (state.lastDay !== today) {
    state.streak = state.lastDay ? state.streak + 1 : 1;
    state.lastDay = today;
  }
}

async function send() {
  const input = $("input");
  const text = input.value.trim();

  if (!text) {
    $("status").textContent = "Type something in English first.";
    return;
  }

  addMsg(text, "user");

  input.value = "";

  $("status").textContent = "JALA Tolk is thinking...";

  state.turns++;
  state.minutes = Math.max(
    state.minutes,
    Math.ceil(state.turns * 1.2)
  );

  updateDay();
  save();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        level: state.level,
        mode: state.mode,
        history: state.history.slice(-8),
        errors: state.errors.slice(-12)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.feedback ||
        data.error ||
        "API request failed."
      );
    }

    const reply = data.reply || "Let's continue.";

    addMsg(
      reply,
      "ai",
      data.feedback || ""
    );

    state.history.push(
      {
        role: "user",
        content: text
      },
      {
        role: "assistant",
        content: reply
      }
    );

    if (data.error_to_remember) {
      state.errors.push(data.error_to_remember);
    }

    save();

    speak(reply);

    $("status").textContent = "Ready.";

  } catch (error) {

    console.error("JALA Tolk error:", error);

    addMsg(
      "I couldn't connect to JALA Tolk.",
      "ai",
      "<span class='danger'>Error:</span> " +
      (error.message || "Unknown error")
    );

    $("status").textContent = "Connection error.";
  }
}

$("send").addEventListener("click", send);

$("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$("level").addEventListener("change", function(e) {
  state.level = e.target.value;
  save();
});

$("mode").addEventListener("change", function(e) {
  state.mode = e.target.value;
  save();
});

$("speakToggle").addEventListener("click", function() {
  voiceOn = !voiceOn;

  $("speakToggle").textContent =
    voiceOn ? "🔊 Voice: ON" : "🔇 Voice: OFF";
});

if ("webkitSpeechRecognition" in window ||
    "SpeechRecognition" in window) {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition = new SR();

  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = function() {
    listening = true;
    $("mic").classList.add("active");
    $("status").textContent =
      "Listening... speak in English.";
  };

  recognition.onend = function() {
    listening = false;
    $("mic").classList.remove("active");
    $("status").textContent = "Ready.";
  };

  recognition.onerror = function() {
    $("status").textContent =
      "Microphone error. You can type instead.";
  };

  recognition.onresult = function(e) {
    let transcript = "";

    for (
      let i = e.resultIndex;
      i < e.results.length;
      i++
    ) {
      transcript += e.results[i][0].transcript;
    }

    $("input").value = transcript;
  };

  $("mic").addEventListener("click", function() {
    if (listening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });

} else {

  $("mic").disabled = true;
  $("status").textContent =
    "Voice input is not supported. Type instead.";
}

renderStats();
firstMessage();
</script>
</body>
</html>
